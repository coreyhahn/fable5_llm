<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 192" width="760" height="192" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
<!--
  One token of the shipped order, 131.138 ms (chip testbench simulation). Light theme.
  Scale: x = 4 + ms * 5.7 px per ms.  0 ms is x = 4; 131.138 ms is x = 4 + 747.4866 = 751.4866.
  Each segment starts at the scaled position of its cumulative start time. Every segment except
  the last in a bar gives up 2 px at its right end for the gap, so width = ms * 5.7 - 2.
  The three model parts sum to 131.118 ms, 0.020 ms (0.114 px) short of the token total.
  Values from the landing page (docs/index.html), section "Where a token's time goes".
-->
<title id="t">One token of the shipped order, 131.138 ms (simulation)</title>
<desc id="d">By activity: weight streaming 54.408 ms, mover work 32.545 ms, layer compute 41.610 ms, everything else 2.575 ms. By part of the model: 24 DeltaNet layers 93.972 ms, 8 full-attention layers 24.407 ms, LM head 12.739 ms.</desc>

<text x="4" y="18" font-size="13" font-weight="600" fill="#14202b">One token of the shipped order, 131.138 ms (simulation)</text>

<!-- Bar 1: by activity -->
<text x="4" y="44" font-size="12" fill="#3f4f5c">By activity</text>
<rect x="4" y="52" width="308.1256" height="22" fill="#2a78d6"/>        <!-- weight streaming: start 0 -> x 4; 54.408 * 5.7 = 310.1256, - 2 = 308.1256 -->
<rect x="314.1256" y="52" width="183.5065" height="22" fill="#eb6834"/> <!-- mover work: start 54.408 -> x 4 + 310.1256 = 314.1256; 32.545 * 5.7 = 185.5065, - 2 = 183.5065 -->
<rect x="499.6321" y="52" width="235.177" height="22" fill="#1baf7a"/>  <!-- layer compute: start 86.953 -> x 4 + 495.6321 = 499.6321; 41.610 * 5.7 = 237.177, - 2 = 235.177 -->
<rect x="736.8091" y="52" width="14.6775" height="22" fill="#9aa6b0"/>  <!-- everything else: start 128.563 -> x 4 + 732.8091 = 736.8091; 2.575 * 5.7 = 14.6775 (last, no gap), ends 751.4866 -->

<rect x="4" y="86" width="11" height="11" fill="#2a78d6"/>
<text x="20" y="95" font-size="12" fill="#3f4f5c">Weight streaming</text>
<text x="130" y="95" font-size="12" fill="#14202b">54.408 ms</text>
<rect x="210" y="86" width="11" height="11" fill="#eb6834"/>
<text x="226" y="95" font-size="12" fill="#3f4f5c">Mover work</text>
<text x="300" y="95" font-size="12" fill="#14202b">32.545 ms</text>
<rect x="380" y="86" width="11" height="11" fill="#1baf7a"/>
<text x="396" y="95" font-size="12" fill="#3f4f5c">Layer compute</text>
<text x="488" y="95" font-size="12" fill="#14202b">41.610 ms</text>
<rect x="566" y="86" width="11" height="11" fill="#9aa6b0"/>
<text x="582" y="95" font-size="12" fill="#3f4f5c">Everything else</text>
<text x="682" y="95" font-size="12" fill="#14202b">2.575 ms</text>

<!-- Bar 2: by part of the model -->
<text x="4" y="128" font-size="12" fill="#3f4f5c">By part of the model</text>
<rect x="4" y="136" width="533.6404" height="22" fill="#eda100"/>        <!-- DeltaNet: start 0 -> x 4; 93.972 * 5.7 = 535.6404, - 2 = 533.6404 -->
<rect x="539.6404" y="136" width="137.1199" height="22" fill="#e87ba4"/> <!-- attention: start 93.972 -> x 4 + 535.6404 = 539.6404; 24.407 * 5.7 = 139.1199, - 2 = 137.1199 -->
<rect x="678.7603" y="136" width="72.6123" height="22" fill="#008300"/>  <!-- LM head: start 118.379 -> x 4 + 674.7603 = 678.7603; 12.739 * 5.7 = 72.6123 (last), ends 751.3726 -->

<rect x="4" y="170" width="11" height="11" fill="#eda100"/>
<text x="20" y="179" font-size="12" fill="#3f4f5c">24 DeltaNet layers</text>
<text x="134" y="179" font-size="12" fill="#14202b">93.972 ms</text>
<rect x="220" y="170" width="11" height="11" fill="#e87ba4"/>
<text x="236" y="179" font-size="12" fill="#3f4f5c">8 full-attention layers</text>
<text x="370" y="179" font-size="12" fill="#14202b">24.407 ms</text>
<rect x="470" y="170" width="11" height="11" fill="#008300"/>
<text x="486" y="179" font-size="12" fill="#3f4f5c">LM head</text>
<text x="546" y="179" font-size="12" fill="#14202b">12.739 ms</text>
</svg>
